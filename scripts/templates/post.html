<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ | Theoric</title>
    <meta name="description" content="$description$">
    <link rel="canonical" href="$canonical$">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta property="og:title" content="$title$ | Theoric">
    <meta property="og:description" content="$description$">
    <meta property="og:type" content="article">
    <meta property="og:url" content="$canonical$">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="$title$ | Theoric">
    <meta name="twitter:description" content="$description$">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <a href="/" aria-label="Theoric home"><img class="logo" src="/assets/theoric-stylized-wordmark.svg" alt="Theoric"></a>

    <article>
        <h1>$title$</h1>
$if(subtitle)$
        <p class="subtitle">$subtitle$</p>
$endif$
        <p class="byline">By <a href="$author_url$" target="_blank" rel="noopener">$author$</a> · <span class="date">$date$</span></p>

$body$
    </article>

    <footer>
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <a href="mailto:team@theoric.com">Contact</a>
        <a href="https://x.com/TheoricLabs" target="_blank" rel="noopener">X</a>
        <a href="https://www.linkedin.com/company/theoriclabs/" target="_blank" rel="noopener">LinkedIn</a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpkg.com/highlightjs-lean@1.2.0/dist/lean.min.js"></script>
    <script>
        document.querySelectorAll('article pre[class] > code').forEach(function (code) {
            code.parentElement.className.split(/\s+/).forEach(function (cls) {
                if (cls) code.classList.add(cls);
            });
            hljs.highlightElement(code);
        });
    </script>
</body>
</html>
